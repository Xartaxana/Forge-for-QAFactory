# Judgment file of comparison run LR2-1 (MyBooks "Add to Cart"): blind evaluation of arms X and Y.
# Transcription of runs/blind-eval.md (evaluator: critic, fresh context, key not opened) and runs/blind-key.txt.
# No judgment is made here. Row values are the evaluator's own words (Russian, verbatim). Rows name arms X / Y only;
# the key is the separate top-level block `key`.
# The evaluator scored against the table of the Lead version (blind-eval.md:11-14, "Ниже счёт по таблице правды"), flagging
# cards where the owner version differs. Every card of the owner version v2026-11-05-owner has one row per arm.
schema: judgment/1
experiment: mybooks/factory-vs-free-agent
run: LR2-1
carrier: 'experiments/mybooks/factory-vs-free-agent/runs/blind-eval.md'
by: 'critic (Opus, t-236), fresh context, key not opened (blind-eval.md:3)'
truth_file: 'experiments/mybooks/truth/add-to-cart.yaml'
evaluated_against_version: v2026-11-05-lead
key:
