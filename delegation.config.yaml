# delegation.config.yaml — Supervised Delegation binding point.
#
# This is the ONE file where function names (the policy vocabulary:
# architect / lead / critic / builder / scout -- see CLAUDE.md; designer is
# bound in its role file's frontmatter)
# are bound to actual models (a property of your deployment, not of the
# policy). CLAUDE.md and the role profiles under .claude/agents/ never
# hardcode a model name for a function. Ranks of the functions and the one
# parser of this file: tools/tier_ladder.py. Changing a binding below does
# not change any rule; a rebinding is recorded in DECISIONS.md.

# contour: which deployment shape you are running.
#   subscription — Claude Code subscription only (policy + agents + journal)
#   api-keys     — API keys from one or more providers (adds gateway/)
#   both         — subscription for coordination, API keys for extra workers
contour: subscription   # subscription | api-keys | both

roles:
  # Coordination tier: decomposition, specs, acceptance, mechanism commits
  # after the critic (D-0067).
  lead:
    subscription:
      model: claude-opus-5-5
    api:
      provider:        # e.g. anthropic, groq, gemini
      model:           # e.g. claude-opus-4-8, llama-3.3-70b-versatile
      api_key_env:     # e.g. ANTHROPIC_API_KEY

  # The rung ABOVE lead: new ideas, process questions the Lead escalates,
  # the weekly calibration and the review of mechanism commits. Summoned
  # only by the operator switching the session model; never routed to
  # automatically and never launched as a subagent (D-0067). `designer` has
  # no row here: it is bound in its role file's frontmatter.
  architect:
    subscription:
      model: claude-fable-5-1
    api:
      provider:
      model:
      api_key_env:

  # Mandatory acceptance gate for builder-class diffs (CLAUDE.md rule 3).
  critic:
    subscription:
      model: claude-opus-5-5
    api:
      provider:
      model:
      api_key_env:

  # Implementation from a written spec (CLAUDE.md rule 2).
  builder:
    subscription:
      model: claude-sonnet-5-5
    api:
      provider:
      model:
      api_key_env:

  # Recon: repo search, file reading, context gathering (CLAUDE.md rule 1).
  scout:
    subscription:
      model: claude-sonnet-5-5
    api:
      provider:
      model:
      api_key_env:

  # api-contour only — Shadow Evaluation judge (a supervised worker,
  # not a rules-level function; see CLAUDE.md's function/grade split).
  judge:
    scope: api-keys-only
    api:
      provider:
      model:
      api_key_env:

  # api-contour only — the local Ledger/Guard analyst worker.
  analyst:
    scope: api-keys-only
    api:
      provider:
      model:
      api_key_env:

# Entrance exams. Every bound model is examined before it starts carrying
# real traffic in its role (PROCESS/LEAD_RANKING_EXAM.md, the critic and
# scout exam skills).
exam:
  mandatory: true
  override_allowed: true
  # A failed exam does not block use outright: the operator can
  # override it with an explicit word ("keep it anyway"). The override
  # itself is never silent — it produces an operator-facing warning
  # plus a decision-log entry (DECISIONS.md) recording the override
  # (model, score), so a later calibration pass can see it.
  on_failure: "warning + decision-log entry (operator override recorded)"
