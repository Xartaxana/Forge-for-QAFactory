<text x="40" y="590" text-anchor="start" font-size="16" font-weight="600" fill="#3d5a80">S5 INSIDE — THE AUTHOR'S GREEN, AN INDEPENDENT CRITIC, AN ISOLATED RED PROBE</text>

<text x="155.5" y="636" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">1 · Scope and windows</text>
<text x="155.5" y="655" text-anchor="middle" font-size="10.5" fill="#1c6b5a">orchestrator + controller</text>
<text x="155.5" y="672" text-anchor="middle" font-size="10.5" fill="#1c6b5a">Scope from stage-scope</text>

<text x="412.5" y="636" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">2 · Execution design, then tests</text>
<text x="412.5" y="655" text-anchor="middle" font-size="10.5" fill="#1c6b5a">qa-automator: reuse → extend → parameterize → new</text>
<text x="412.5" y="672" text-anchor="middle" font-size="10.5" fill="#1c6b5a">One initial targeted run</text>
<text x="412.5" y="689" text-anchor="middle" font-size="10.5" fill="#1c6b5a">After a repair: changed only</text>
<line x1="270" y1="659.0" x2="289" y2="659.0" stroke="#3a3f45" stroke-width="1.4"/>

<text x="926.5" y="636" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">4 · Independent code review</text>

<text x="926.5" y="672" text-anchor="middle" font-size="10.5" fill="#1c6b5a">Meaning, not presence</text>

<text x="1183.5" y="652" text-anchor="middle" font-size="10.5" fill="#1c6b5a">Isolated exact-byte copy</text>
<text x="1183.5" y="667" text-anchor="middle" font-size="10.5" fill="#1c6b5a">Mutated + unmutated baseline</text>
<text x="1183.5" y="682" text-anchor="middle" font-size="10.5" fill="#1c6b5a">The critic checks the failure site</text>
<text x="1183.5" y="697" text-anchor="middle" font-size="10" fill="#1c6b5a">(not for a red the requirement contradicts)</text>

<path d="M 926.5 708 V 758 H 378.5 V 714" fill="none" stroke="#3a3f45" stroke-width="1.3" stroke-dasharray="6 5"/>
<polygon points="378.5,710 374.0,718 383.0,718" fill="#3a3f45"/>
<text x="652" y="748" text-anchor="middle" font-size="12.5" font-weight="400" fill="#2b6c5d">critic remarks → author fix</text>
<text x="40" y="782" text-anchor="start" font-size="12.5" font-weight="400" fill="#2b6c5d">s5_precheck findings go back to the AUTHOR as one repair round, with no critic round; its hint lines are advice and never fail the gate.</text>
<text x="40" y="800" text-anchor="start" font-size="12.5" font-weight="400" fill="#2b6c5d">Critic remarks → author fix → targeted PASS → review of the changes → red only for missing / stale proofs. A spent repair limit is a question with its price.</text>
<text x="40" y="818" text-anchor="start" font-size="12.5" font-weight="400" fill="#2b6c5d">FAIL / ERROR is diagnosed first; a confirmed product defect ≠ a test bug and ≠ a PASS. Red: the required assertion failed for the expected reason.</text>
<text x="40" y="836" text-anchor="start" font-size="12.5" font-weight="400" fill="#2b6c5d">Import / auth / network errors do not count as proof.</text>
<rect x="40" y="858" width="740" height="92" rx="6" fill="#f0f1f2" stroke="#c8ccd0" stroke-width="1.2"/>
<text x="410.0" y="888" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">What no longer happens</text>
<text x="410.0" y="909" text-anchor="middle" font-size="11.5" fill="#1c6b5a">Critic-green / post-revert green / a repeated S6 green / a run for the report's sake.</text>
<text x="410.0" y="928" text-anchor="middle" font-size="11.5" fill="#1c6b5a">Regression is run neither by the runner nor by the factory through CI.</text>

<text x="1190.0" y="928" text-anchor="middle" font-size="11.5" fill="#1c6b5a">Three batch runs; build separately; the critic checks the causes of the failures.</text>

<text x="800.0" y="1026" text-anchor="middle" font-size="12" fill="#1c6b5a">Revision + hashes + links keep traceability. Resume does not repeat accepted windows. Doctor shows readiness and the next action.</text>
<text x="800.0" y="1046" text-anchor="middle" font-size="12" fill="#1c6b5a">Unknown / skipped / stale stay unverified. Late usage updates the cost without a new story run.</text>
