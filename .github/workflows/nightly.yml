# Forge CI on GitHub, tier 3 (ported from .gitlab-ci.yml jobs package-full, install-smoke, package-full-report, crap-measure).
# STAGED COPY: goes to .github/workflows/ of Xartaxana/Forge-for-QAFactory at the move. tools/test_workflows.py judges it.
#   package-full         the full selftest in two shards (selftest.py --shard I/N), at once; nightly, and by the Run button
#   install-smoke        install_smoke.py, a job of its own next to the shards (not after them)
#   package-full-report  joins the shard outputs and diffs scripts/slow_tests.json against them (--slow-tests --from)
#   crap-measure         the CRAP report under coverage; nightly only, a measurement (never red for the release verdict)
#   quarantine-check     tools/test_quarantine.py check, the history guard of the test quarantine; nightly only; red on a violation
#   test-redundancy      every package test file under coverage with its own name as the context (tools/test_redundancy.py,
#                        TD-12; 1-3 hours; a measurement): ONLY a dispatched run with the input TEST_REDUNDANCY=1, or one whose
#                        ref starts with measure/ (also inside the canon, which calls this file); REDUNDANCY_SCOPE=keep -> --keep-only.
#                        Start: python tools/ci_read.py start --workflow nightly.yml --ref <branch> --var TEST_REDUNDANCY=1 [--var REDUNDANCY_SCOPE=keep]
# The quarantine watch is NOT here: it is quarantine-watch.yml with its own schedule, so neither schedule starts the other's jobs.
# board-check is not ported: it mirrors piles to GitLab issues (tools/piles_gitlab.py) and there is no port to
# GitHub Issues (owner's word, plan O6).
# MINUTES: a private repo on GitHub Free has 2000 Linux minutes a month. The job "skip-if-unchanged" stops the
# nightly run when main has no new commit in the last 24 hours, so a quiet night costs ~1 minute, not hours.
name: nightly

on:
  schedule:
    - cron: "0 1 * * *"     # 01:00 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: "branch or sha to run the full tier on"
        required: false
        default: main
      # the GitLab pipeline variables of the test-redundancy job, under the same names (ci_read.py start --var KEY=VALUE)
      TEST_REDUNDANCY:
        description: "1 = also run the test-redundancy measurement (1-3 hours); empty = not"
        required: false
        default: ""
      REDUNDANCY_SCOPE:
        description: "keep = measure only the keep rows of test-layers.json (--keep-only); empty = every test file"
        required: false
        default: ""
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: main
      TEST_REDUNDANCY:            # passed by canon.yml (the GitLab api pipeline with TEST_REDUNDANCY=1 is the canon plus it)
        type: string
        required: false
        default: ""
      REDUNDANCY_SCOPE:
        type: string
        required: false
        default: ""

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  EVENT_NAME: ${{ github.event_name }}

jobs:
  skip-if-unchanged:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.c.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
          ref: ${{ inputs.ref || 'main' }}
      - id: c
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $((now - last)) -lt 90000 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "main unchanged for 25h: nightly skipped"; fi

  package-full:
    needs: skip-if-unchanged
    if: needs.skip-if-unchanged.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false          # a red shard does not hide the other
      matrix:
        shard: [1, 2]           # the two shards of .gitlab-ci.yml (parallel: 2)
    env:
      NODE_INDEX: ${{ matrix.shard }}
      NODE_TOTAL: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || 'main' }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -q pytest
      - run: |
          git config --global user.name "forge-ci"
          git config --global user.email "forge-ci@invalid.example"
          git config --global init.defaultBranch main
      - name: full selftest, one shard
        run: |
          OUT="$GITHUB_WORKSPACE/ci-out"; mkdir -p "$OUT"
          # the clone report (B-417): a measurement of shard 1 only, so a failure here is printed and never flips the release verdict
          if [ "$NODE_INDEX" = "1" ]; then python tools/dup_ratchet.py --report "$OUT" || echo "dup report: exit $? (a report, not the release verdict)"; fi
          cd ai-packages/qa-factory
          rc=0
          python -B scripts/selftest.py --jobs 4 --shard "$NODE_INDEX/$NODE_TOTAL" > "$OUT/selftest-shard-$NODE_INDEX-of-$NODE_TOTAL.txt" 2>&1 || rc=1
          tail -n 25 "$OUT/selftest-shard-$NODE_INDEX-of-$NODE_TOTAL.txt"
          exit $rc
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: package-full-shard-${{ matrix.shard }}
          path: ci-out/
          retention-days: 14

  install-smoke:
    needs: skip-if-unchanged
    if: needs.skip-if-unchanged.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || 'main' }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -q pytest
      - run: |
          git config --global user.name "forge-ci"
          git config --global user.email "forge-ci@invalid.example"
          git config --global init.defaultBranch main
      - name: install smoke
        run: |
          OUT="$GITHUB_WORKSPACE/ci-out"; mkdir -p "$OUT"
          cd ai-packages/qa-factory
          rc=0
          python -B scripts/install_smoke.py > "$OUT/install_smoke.txt" 2>&1 || rc=1
          tail -n 25 "$OUT/install_smoke.txt"
          exit $rc
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: install-smoke-ci-out
          path: ci-out/
          retention-days: 14

  package-full-report:
    # the drift diff of scripts/slow_tests.json against the durations of the WHOLE run: the shard outputs are joined
    # (a missing, repeated or mixed shard output is exit 2 of the tool). Needs both shards green, like the GitLab job.
    needs: package-full
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref || 'main' }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          pattern: package-full-shard-*
          path: ci-out
          merge-multiple: true
      - name: join the shards, diff slow_tests.json
        run: |
          set -e
          cat ci-out/selftest-shard-*.txt > ci-out/selftest.txt
          cd ai-packages/qa-factory
          python -B scripts/selftest.py --slow-tests --from "$GITHUB_WORKSPACE/ci-out/selftest.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: package-full-report
          path: ci-out/selftest.txt
          retention-days: 14

  crap-measure:
    needs: skip-if-unchanged
    if: github.event_name == 'schedule' && needs.skip-if-unchanged.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          pip install -q pytest coverage==7.16.2
          python -m coverage --version
          python -m coverage debug sys
          git config --global user.name "forge-ci"
          git config --global user.email "forge-ci@invalid.example"
          git config --global init.defaultBranch main
      - name: selftest under coverage, CRAP report
        run: |
          W="$GITHUB_WORKSPACE"
          mkdir -p ci-out/crap/data
          sha256sum ai-packages/qa-factory/scripts/*.py > ci-out/crap/coverage-files.sha256
          printf '%s\n' '[run]' 'parallel = True' "data_file = $W/ci-out/crap/data/.coverage" "source = $W/ai-packages/qa-factory/scripts" 'omit = */scripts/tests/*' 'disable_warnings = no-data-collected, module-not-imported, module-not-measured' > ci-out/crap/coveragerc
          python -c "import sysconfig; open(sysconfig.get_paths()['purelib'] + '/zz_coverage_startup.pth', 'w').write('import coverage; coverage.process_startup()\n')"
          export COVERAGE_PROCESS_START="$W/ci-out/crap/coveragerc"
          (cd ai-packages/qa-factory && python -B scripts/selftest.py --jobs 4) > ci-out/crap/selftest-under-coverage.txt 2>&1 || true
          unset COVERAGE_PROCESS_START
          echo "coverage data files $(ls -A ci-out/crap/data | wc -l); selftest FAIL lines $(grep -c '^FAIL' ci-out/crap/selftest-under-coverage.txt || true)"
          tail -n 5 ci-out/crap/selftest-under-coverage.txt
          python -m coverage combine --rcfile=ci-out/crap/coveragerc
          python -m coverage json --rcfile=ci-out/crap/coveragerc -o ci-out/crap/coverage.json
          python tools/crap_report.py --coverage ci-out/crap/coverage.json --coverage-hashes ci-out/crap/coverage-files.sha256 --require-coverage > ci-out/crap/crap-report.md
          python tools/crap_report.py --coverage ci-out/crap/coverage.json --coverage-hashes ci-out/crap/coverage-files.sha256 --require-coverage --json > ci-out/crap/crap-report.json
          head -n 25 ci-out/crap/crap-report.md
          rm -rf ci-out/crap/data
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: crap-report
          path: ci-out/crap/
          retention-days: 14

  quarantine-check:
    # the test quarantine history guard (td-15 K5; owner's word 13.11.2026: moved here from forge-check, it walks every commit since
    # test-layers.json appeared and outlived that job). SCHEDULE ONLY: a dispatched run (the Run button) and a called run (canon.yml,
    # which carries the caller's event) do not start it. A guard, not a measurement: no continue-on-error, a violation makes the nightly red.
    needs: skip-if-unchanged
    if: github.event_name == 'schedule' && needs.skip-if-unchanged.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/test_quarantine.py check

  test-redundancy:
    # .gitlab-ci.yml test-redundancy: a measurement, never a gate (continue-on-error = allow_failure; the run and the report are
    # `|| true` so the totals print even when files were red). Its rule `(web || api) && (TEST_REDUNDANCY == "1" || ref =~ ^measure/)`
    # is a dispatched run (the event of a called run is the caller's, so the canon on a measure/ ref runs it too) whose input
    # TEST_REDUNDANCY is "1" or whose ref starts with measure/; never a schedule, push or pull request. No needs (`needs: []`).
    if: github.event_name == 'workflow_dispatch' && (inputs.TEST_REDUNDANCY == '1' || startsWith(inputs.ref, 'measure/'))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    continue-on-error: true
    env:
      REDUNDANCY_SCOPE: ${{ inputs.REDUNDANCY_SCOPE }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || 'main' }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          pip install -q pytest coverage==7.16.2
          python -m coverage --version
          python -m coverage debug sys
          git config --global user.name "forge-ci"
          git config --global user.email "forge-ci@invalid.example"
          git config --global init.defaultBranch main
      - name: test redundancy (smoke on one file, then the whole run and its report)
        run: |
          mkdir -p ci-out/redundancy
          python -c "import sysconfig; open(sysconfig.get_paths()['purelib'] + '/zz_coverage_startup.pth', 'w').write('import coverage; coverage.process_startup()\n')"
          python tools/test_redundancy.py run --package ai-packages/qa-factory --out ci-out/redundancy-smoke --jobs 2 --only "test_adapter_forms.py" || true
          python tools/test_redundancy.py report --data ci-out/redundancy-smoke/data/.coverage --runs ci-out/redundancy-smoke/runs.json --out ci-out/redundancy-smoke || true
          head -n 14 ci-out/redundancy-smoke/test-redundancy.md || true
          if [ "$REDUNDANCY_SCOPE" = "keep" ]; then python tools/test_redundancy.py run --package ai-packages/qa-factory --out ci-out/redundancy --jobs 4 --keep-only > ci-out/redundancy/run-log.txt 2>&1 || true; else python tools/test_redundancy.py run --package ai-packages/qa-factory --out ci-out/redundancy --jobs 4 > ci-out/redundancy/run-log.txt 2>&1 || true; fi
          tail -n 5 ci-out/redundancy/run-log.txt
          python tools/test_redundancy.py report --data ci-out/redundancy/data/.coverage --runs ci-out/redundancy/runs.json --out ci-out/redundancy || true
          sed -n '/^## A\./,$p' ci-out/redundancy/test-redundancy.md | head -n 40 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-redundancy
          path: |
            ci-out/redundancy/*.md
            ci-out/redundancy/*.json
          retention-days: 30
